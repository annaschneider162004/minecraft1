plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.annaschneider.minecraft1'
version = '1.0.0'

base { archivesName = 'architect' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { architect { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

jar { manifest { attributes(['Specification-Title': 'Architect', 'Specification-Vendor': 'annaschneider162004', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) } }

publishing { publications { mavenJava(MavenPublication) { from components.java } } repositories { maven { url = uri("${project.projectDir}/repo") } } }
