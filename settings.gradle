pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Fabric Loom adds its own repositories (Mojang libraries, remapped Minecraft jars) to :architect-mod, so project
    // repositories must be allowed; every other module uses the repositories below.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

rootProject.name = 'minecraft1'
include 'architect-domain', 'build-assistant', 'instant-builder', 'build-transformer', 'world-generator', 'ai-foundation', 'large-build', 'architect-link', 'architect-mod', 'architect-desktop', 'fabric-stubs'
